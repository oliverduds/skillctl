[package]
name = "skillctl"
version = "0.2.0"
edition = "2021"
description = "Gerenciador unificado de Agent Skills (menu interativo + CLI) em Rust"
license = "MIT"
repository = "https://github.com/oliverduds/skillctl"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
